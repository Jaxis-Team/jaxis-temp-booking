const MAKEUP_URL = "https://docs.google.com/forms/d/1WT4dLtC7vDA-d0vtCzwMAeuwIaJ9HvNEKE21Nsaa1jw/viewform";

function renderTable(data, tbodyId, countId) {
  const tb = document.getElementById(tbodyId);
  data.forEach(r=>{
    const note = r.note?`<div class="note">${r.note}</div>`:"";
    const makeupBtn = r.makeup
      ? `<a href="${MAKEUP_URL}" target="_blank" class="makeup-link">\ud83d\udcdd \u767b\u8a18\u88dc\u8ab2</a>`
      : "";
    tb.insertAdjacentHTML("beforeend",
      `<tr><td>${r.d}</td><td>${r.t}</td><td><span class="badge ${cls[r.s]}">${lbl[r.s]}</span>${makeupBtn}${note}</td></tr>`);
  });
  document.getElementById(countId).textContent = "(\u5171 "+data.length+" \u5802)";
}
renderTable(newTerm, "tbody2", "count2");
renderTable(prevTerm, "tbody1", "count1");

function dl(){
  let csv = "\u65b0\u5b78\u671f,,,\n\u65e5\u671f,\u6642\u9593,\u72c0\u614b,\u5099\u8a3b\n";
  newTerm.forEach(r=> csv += r.d+","+r.t+","+r.s+","+(r.note||"")+"\n");
  csv += "\n\u4e0a\u5b78\u671f,,,\n\u65e5\u671f,\u6642\u9593,\u72c0\u614b,\u5099\u8a3b\n";
  prevTerm.forEach(r=> csv += r.d+","+r.t+","+r.s+","+(r.note||"")+"\n");
  const b = new Blob(["\ufeff"+csv],{type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = "chih_summary.csv"; a.click();
}
