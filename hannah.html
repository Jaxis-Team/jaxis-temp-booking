<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hannah &amp; Isla — JAXIS 一對一課程追蹤</title>
<style>
  :root {
    --bg: #F5EFE1;
    --card: #fff;
    --card-shadow: 0 1px 4px rgba(0,0,0,.06);
    --zoom: #2D8CFF;
    --makeup: #7A5CB0;
    --leave: #C77D3E;
    --pay-green: #2E7D4B;
    --pay-yellow: #F2B90C;
    --pay-yellow-text: #4A3800;
    --yes-bg: #E4F5E9;
    --yes-text: #1E7A44;
    --pending-btn: #B02234;
    --upcoming-bg: #E6F1FB;
    --upcoming-text: #0C447C;
    --confirm-bg: #FFF3CD;
    --confirm-text: #856404;
    --text: #1f1e1b;
    --text-sub: #6b6a63;
    --text-muted: #9a988f;
    --border: #e3e1d8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Times New Roman", Georgia, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 1.5rem 1rem 3rem;
  }
  .wrap { max-width: 700px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 2px; }
  .sub-header { font-size: 13px; color: var(--text-sub); margin-bottom: 1.25rem; }

  .action-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
  .action-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 8px 14px; border-radius: 8px; font-size: 13px;
    text-decoration: none; color: #fff; font-weight: 500; border: none; cursor: pointer;
  }
  .btn-zoom { background: var(--zoom); }
  .btn-makeup { background: var(--makeup); }
  .btn-leave { background: var(--leave); }

  .card {
    background: var(--card);
    border-radius: 12px;
    box-shadow: var(--card-shadow);
    padding: 1rem 1.25rem;
    margin-bottom: 1rem;
  }
  .card-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; }

  .pay-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pay-btn {
    display: block; text-align: center; padding: 10px 6px; border-radius: 8px;
    font-size: 13px; font-weight: 600; text-decoration: none; color: #fff;
    background: var(--pay-green);
  }
  .pay-btn.yellow { background: var(--pay-yellow); color: var(--pay-yellow-text); }
  .pay-btn-wide { grid-column: span 3; }

  .points-row { display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: center; }
  .metric-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 1px; }
  .metric-value { font-size: 20px; font-weight: 700; }
  .metric-value.low { color: var(--pending-btn); }
  .metric-sm { font-size: 15px; font-weight: 600; }

  .warn-banner {
    background: #FFF3CD; border-left: 4px solid #FFBF00; padding: 10px 14px;
    border-radius: 8px; font-size: 13px; color: #856404; margin-bottom: 1rem;
  }

  .tabs { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; }
  .tab-btn {
    border: 1px solid var(--border); background: var(--card); padding: 7px 18px;
    border-radius: 8px; font-size: 14px; cursor: pointer; color: var(--text-sub);
    font-family: inherit;
  }
  .tab-btn.active { background: var(--text); color: #fff; border-color: var(--text); }
  .panel { display: none; }
  .panel.active { display: block; }

  .section-badge {
    display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px;
    border-radius: 6px; margin: 1rem 0 8px;
  }
  .badge-full { color: #0f6e56; background: #e1f5ee; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; font-size: 13px; border-bottom: 1px solid #f0ede5; }
  th { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .02em; font-weight: 500; }
  tr:last-child td { border-bottom: none; }

  .att-yes {
    display: inline-block; padding: 2px 10px; border-radius: 5px; font-size: 12px; font-weight: 500;
    background: var(--yes-bg); color: var(--yes-text);
  }
  .att-upcoming {
    display: inline-block; padding: 2px 10px; border-radius: 5px; font-size: 12px; font-weight: 500;
    background: var(--upcoming-bg); color: var(--upcoming-text);
  }
  .att-confirm {
    display: inline-block; padding: 2px 10px; border-radius: 5px; font-size: 12px; font-weight: 600;
    background: var(--confirm-bg); color: var(--confirm-text);
  }
  .att-makeup-btn {
    display: inline-block; padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600;
    background: var(--pending-btn); color: #fff; text-decoration: none; cursor: pointer;
  }
  .makeup-note { font-size: 11px; color: var(--pending-btn); }

  .empty-note { font-size: 13px; color: var(--text-muted); padding: 10px 0; }

  .dl-btn {
    margin-top: 1rem; border: 1px solid var(--border); background: var(--card);
    padding: 8px 18px; border-radius: 8px; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  .dl-btn:hover { background: #f0ede5; }
  .footer { font-size: 11px; color: var(--text-muted); margin-top: 1.5rem; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">

  <h1>Hannah &amp; Isla</h1>
  <div class="sub-header">家長：Mandy Chen ｜ 老師：安東尼老師 Teacher Anthony</div>

  <div class="action-row">
    <a class="action-btn btn-zoom" href="https://us02web.zoom.us/j/83992491631" target="_blank">🎥 進入教室 (Hannah)</a>
    <a class="action-btn btn-makeup" href="https://docs.google.com/forms/d/1WT4dLtC7vDA-d0vtCzwMAeuwIaJ9HvNEKE21Nsaa1jw/viewform" target="_blank">📝 補課登記</a>
    <a class="action-btn btn-leave" href="https://forms.gle/vriQ4zbMYuq4w1N48" target="_blank">🙋 我要請假</a>
  </div>

  <div class="card">
    <div class="card-title">課卡購買</div>
    <div class="pay-grid">
      <a class="pay-btn" href="https://book.stripe.com/aFa6oI95m61Z9I4fgk8AE06" target="_blank">500點</a>
      <a class="pay-btn" href="https://book.stripe.com/bJe7sMbdu1LJ9I4fgk8AE0c" target="_blank">250點</a>
      <a class="pay-btn" href="https://book.stripe.com/fZucN6epGbmj5rO6JO8AE0d" target="_blank">200點</a>
      <a class="pay-btn" href="https://book.stripe.com/eVq9AUchy7633jGb048AE0e" target="_blank">100點</a>
      <a class="pay-btn" href="https://book.stripe.com/00wfZidlC61ZaM85FK8AE0f" target="_blank">50點</a>
      <a class="pay-btn" href="https://book.stripe.com/8x2bJ2bdubmjaM85FK8AE0g" target="_blank">20點</a>
      <a class="pay-btn yellow pay-btn-wide" href="https://book.stripe.com/7sY6oIchyeyvbQc5FK8AE0b" target="_blank">一對一課程40堂</a>
    </div>
  </div>

  <!-- Student tabs -->
  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>

  <button class="dl-btn" onclick="downloadSummary()">📥 下載 CSV 摘要</button>

  <div class="footer">
    此為手動追蹤系統，非即時連動預約平台。請於預約或出席變更時手動更新。<br>
    最後更新：2026-08-18
  </div>
</div>

<script>
const MAKEUP_URL = "https://docs.google.com/forms/d/1WT4dLtC7vDA-d0vtCzwMAeuwIaJ9HvNEKE21Nsaa1jw/viewform";

const students = {
  "Hannah": {
    points: 6,
    pass: { name: "100點 - $9,500", usage: "120 / 120", remaining: 0, expiration: "2026-11-09", active: false },
    schedule: [
      { time: "2026-05-21 09:00", att: "Yes" },
      { time: "2026-05-28 09:00", att: "Yes" },
      { time: "2026-06-04 09:00", att: "Yes" },
      { time: "2026-06-11 09:00", att: "Yes" },
      { time: "2026-06-18 09:00", att: "Yes" },
      { time: "2026-06-25 09:00", att: "Yes" },
      { time: "2026-07-02 09:00", att: "Yes" },
      { time: "2026-07-09 09:00", att: "Yes" },
      { time: "2026-07-23 09:00", att: "Yes" },
      { time: "2026-07-30 09:00", att: "Yes" },
      { time: "2026-08-04 18:45", att: "Yes", note: "Makeup for 7/16" },
      { time: "2026-08-13 09:00", att: "Upcoming" },
      { time: "2026-08-18 19:55", att: "Upcoming", note: "Makeup for 8/6" },
      { time: "2026-08-20 09:00", att: "Upcoming" },
      { time: "2026-08-27 09:00", att: "Upcoming" },
      { time: "2026-09-03 09:00", att: "Upcoming" },
      { time: "2026-09-10 09:00", att: "Upcoming" },
      { time: "2026-09-17 09:00", att: "Upcoming" },
      { time: "2026-09-24 09:00", att: "Upcoming" },
      { time: "2026-10-01 09:00", att: "Upcoming" }
    ]
  },
  "Isla": {
    points: 6,
    pass: null,
    schedule: [
      { time: "2026-09-03 14:20", att: "待確認" },
      { time: "2026-09-10 14:20", att: "待確認" },
      { time: "2026-09-17 14:20", att: "待確認" },
      { time: "2026-09-24 14:20", att: "待確認" },
      { time: "2026-10-01 14:20", att: "待確認" },
      { time: "2026-10-08 14:20", att: "待確認" },
      { time: "2026-10-15 14:20", att: "待確認" },
      { time: "2026-10-22 14:20", att: "待確認" },
      { time: "2026-10-29 14:20", att: "待確認" },
      { time: "2026-11-05 14:20", att: "待確認" },
      { time: "2026-11-12 14:20", att: "待確認" },
      { time: "2026-11-19 14:20", att: "待確認" },
      { time: "2026-11-26 14:20", att: "待確認" },
      { time: "2026-12-03 14:20", att: "待確認" },
      { time: "2026-12-10 14:20", att: "待確認" },
      { time: "2026-12-17 14:20", att: "待確認" },
      { time: "2026-12-31 14:20", att: "待確認" },
      { time: "2027-01-07 14:20", att: "待確認" },
      { time: "2027-01-14 14:20", att: "待確認" },
      { time: "2027-01-21 14:20", att: "待確認" }
    ]
  }
};

function fmt(t) {
  const [d, time] = t.split(" ");
  const [y, m, day] = d.split("-");
  const days = ["日","一","二","三","四","五","六"];
  const dt = new Date(+y, +m-1, +day);
  return `${+m}/${+day}（${days[dt.getDay()]}）${time}`;
}

function attBadge(att) {
  if (att === "Yes") return '<span class="att-yes">✓ 已上課</span>';
  if (att === "Upcoming") return '<span class="att-upcoming">待上課</span>';
  if (att === "待確認") return '<span class="att-confirm">待確認</span>';
  if (att === "待補課") return '<a class="att-makeup-btn" href="'+MAKEUP_URL+'" target="_blank">補課去 →</a>';
  return att;
}

function buildTable(rows, pts) {
  if (!rows.length) return '<div class="empty-note">尚無排課</div>';
  let h = '<table><thead><tr><th>#</th><th>日期</th><th>點數</th><th>狀態</th></tr></thead><tbody>';
  rows.forEach((r, i) => {
    const noteHtml = r.note ? ` <span class="makeup-note">(${r.note})</span>` : '';
    h += `<tr><td>${i+1}</td><td>${fmt(r.time)}${noteHtml}</td><td>${pts}</td><td>${attBadge(r.att)}</td></tr>`;
  });
  h += '</tbody></table>';
  return h;
}

function buildPassCard(pass) {
  if (!pass) {
    return '<div class="card"><div class="card-title">課卡狀態</div><div class="warn-banner" style="margin-bottom:0">⚠️ 尚未購買點數 — Pending pass purchase. Points card will show once confirmed.</div></div>';
  }
  const low = pass.remaining <= 0;
  let html = '<div class="card"><div class="card-title">課卡</div><div class="points-row">';
  html += `<div><div class="metric-label">課卡</div><div class="metric-sm">${pass.name}</div></div>`;
  html += `<div><div class="metric-label">使用量</div><div class="metric-sm">${pass.usage}</div></div>`;
  html += `<div><div class="metric-label">剩餘點數</div><div class="metric-value${low?' low':''}">${pass.remaining}</div></div>`;
  html += `<div><div class="metric-label">到期日</div><div class="metric-sm">${pass.expiration}</div></div>`;
  html += '</div></div>';
  if (!pass.active) {
    html += '<div class="warn-banner">⚠️ 目前沒有可用點數 — No active pass. Please purchase a new pass above to continue booking.</div>';
  }
  return html;
}

const tabsEl = document.getElementById("tabs");
const panelsEl = document.getElementById("panels");
const names = Object.keys(students);

names.forEach((name, i) => {
  const btn = document.createElement("button");
  btn.className = "tab-btn" + (i===0?" active":"");
  btn.textContent = name;
  btn.onclick = () => switchTab(name);
  btn.id = "tab-"+name;
  tabsEl.appendChild(btn);

  const s = students[name];
  const panel = document.createElement("div");
  panel.className = "panel" + (i===0?" active":"");
  panel.id = "panel-"+name;

  let html = buildPassCard(s.pass);
  html += `<div class="card"><span class="section-badge badge-full">課程總覽 Full Schedule（${s.schedule.length}）</span>${buildTable(s.schedule, s.points)}</div>`;
  panel.innerHTML = html;
  panelsEl.appendChild(panel);
});

function switchTab(name) {
  names.forEach(n => {
    document.getElementById("tab-"+n).classList.toggle("active", n===name);
    document.getElementById("panel-"+n).classList.toggle("active", n===name);
  });
}

function downloadSummary() {
  let csv = "Student,Date,Points,Attendance,Note\n";
  names.forEach(name => {
    const s = students[name];
    s.schedule.forEach(r => { csv += `${name},${fmt(r.time)},${s.points},${r.att},${r.note||''}\n`; });
  });
  const blob = new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8;"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "hannah_isla_booking_summary.csv";
  a.click();
}
</script>
</body>
</html>
