<!DOCTYPE html>

<title>素欣家 — JAXIS 一對一課程追蹤</title>
<style>
  :root {
    --bg: #F5EFE1;
    --card: #fff;
    --card-shadow: 0 1px 4px rgba(0,0,0,.06);
    --zoom: #2D8CFF;
    --makeup: #7A5CB0;
    --leave: #C77D3E;
    --pay-green: #2E7D4B;
    --pay-yellow: #F2B90C;
    --pay-yellow-text: #4A3800;
    --yes-bg: #E4F5E9;
    --yes-text: #1E7A44;
    --pending-btn: #B02234;
    --upcoming-bg: #E6F1FB;
    --upcoming-text: #0C447C;
    --text: #1f1e1b;
    --text-sub: #6b6a63;
    --text-muted: #9a988f;
    --border: #e3e1d8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Times New Roman", Georgia, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 1.5rem 1rem 3rem;
  }
  .wrap { max-width: 700px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 2px; }
  .sub-header { font-size: 13px; color: var(--text-sub); margin-bottom: 1.25rem; }
  .action-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
  .action-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 8px 14px; border-radius: 8px; font-size: 13px;
    text-decoration: none; color: #fff; font-weight: 500; border: none; cursor: pointer;
  }
  .btn-zoom { background: var(--zoom); }
  .btn-makeup { background: var(--makeup); }
  .btn-leave { background: var(--leave); }
  .card {
    background: var(--card);
    border-radius: 12px;
    box-shadow: var(--card-shadow);
    padding: 1rem 1.25rem;
    margin-bottom: 1rem;
  }
  .card-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .pay-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pay-btn {
    display: block; text-align: center; padding: 10px 6px; border-radius: 8px;
    font-size: 13px; font-weight: 600; text-decoration: none; color: #fff;
    background: var(--pay-green);
  }
  .pay-btn.yellow { background: var(--pay-yellow); color: var(--pay-yellow-text); }
  .pay-btn-wide { grid-column: span 3; }
  .points-row { display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: center; }
  .metric-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 1px; }
  .metric-value { font-size: 20px; font-weight: 700; }
  .metric-value.ok { color: var(--pay-green); }
  .metric-sm { font-size: 15px; font-weight: 600; }
  .tabs { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; }
  .tab-btn {
    border: 1px solid var(--border); background: var(--card); padding: 7px 18px;
    border-radius: 8px; font-size: 14px; cursor: pointer; color: var(--text-sub);
    font-family: inherit;
  }
  .tab-btn.active { background: var(--text); color: #fff; border-color: var(--text); }
  .panel { display: none; }
  .panel.active { display: block; }
  .section-badge {
    display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px;
    border-radius: 6px; margin: 0.75rem 0 8px;
  }
  .badge-old { color: #854f0b; background: #faeeda; }
  .badge-new { color: #0f6e56; background: #e1f5ee; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; font-size: 13px; border-bottom: 1px solid #f0ede5; }
  th { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .02em; font-weight: 500; }
  tr:last-child td { border-bottom: none; }
  .att-yes {
    display: inline-block; padding: 2px 10px; border-radius: 5px; font-size: 12px; font-weight: 500;
    background: var(--yes-bg); color: var(--yes-text);
  }
  .att-upcoming {
    display: inline-block; padding: 2px 10px; border-radius: 5px; font-size: 12px; font-weight: 500;
    background: var(--upcoming-bg); color: var(--upcoming-text);
  }
  .att-makeup-btn {
    display: inline-block; padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600;
    background: var(--pending-btn); color: #fff; text-decoration: none; cursor: pointer;
  }
  .att-makeup-btn:hover { opacity: .85; }
  .empty-note { font-size: 13px; color: var(--text-muted); padding: 10px 0; }
  .dl-btn {
    margin-top: 1rem; border: 1px solid var(--border); background: var(--card);
    padding: 8px 18px; border-radius: 8px; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  .dl-btn:hover { background: #f0ede5; }
  .footer { font-size: 11px; color: var(--text-muted); margin-top: 1.5rem; line-height: 1.7; }
</style>
</head>

function fmt(t) {
  const [d, time] = t.split(" ");
  const [y, m, day] = d.split("-");
  const days = ["日","一","二","三","四","五","六"];
  const dt = new Date(+y, +m-1, +day);
  return `${+m}/${+day}（${days[dt.getDay()]}）${time}`;
}

function attBadge(att) {
  if (att === "Yes") return '<span class="att-yes">✓ 已上課</span>';
  if (att === "Upcoming") return '<span class="att-upcoming">待上課</span>';
  if (att === "待補課") return '<a class="att-makeup-btn" href="'+MAKEUP_URL+'" target="_blank">補課去 →</a>';
  return att;
}

function buildTable(rows, pts) {
  if (!rows.length) return '<div class="empty-note">尚無排課</div>';
  let h = '<table><thead><tr><th>#</th><th>日期</th><th>點數</th><th>狀態</th></tr></thead><tbody>';
  rows.forEach((r, i) => {
    h += `<tr><td>${i+1}</td><td>${fmt(r.time)}</td><td>${pts}</td><td>${attBadge(r.att)}</td></tr>`;
  });
  h += '</tbody></table>';
  return h;
}

function switchTab(name) {
  names.forEach(n => {
    document.getElementById("tab-"+n).classList.toggle("active", n===name);

  });
}

function downloadSummary() {
  let csv = "Student,Term,Date,Points,Attendance\n";
  names.forEach(name => {
    const s = students[name];
    s.oldTerm.forEach(r => { csv += `${name},Old Term Leftover,${fmt(r.time)},${s.points},${r.att}\n`; });
    s.newTerm.forEach(r => { csv += `${name},New Term,${fmt(r.time)},${s.points},${r.att}\n`; });
  });
  csv += `\n共用點數卡,,使用量,398 / 500\n共用點數卡,,剩餘,102\n共用點數卡,,到期日,2027-04-03\n`;
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "suxin_family_booking_summary.csv";
